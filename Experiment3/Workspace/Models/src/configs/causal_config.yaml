# Causal Model Configuration
data:
    input_file: "./data/35/database_similarity.xlsx"
    output_dir: "./causal_outputs/"

preprocessing:
    # Recompute the "Difference BFI-TIPI <trait>" inputs from raw BFI/TIPI
    # columns scaled to a common [0, 1] range (MinMax) before differencing.
    # This keeps the causal model on the same input scale as the GNN SEMHead,
    # which differences a [0, 1] BFI prediction against [0, 1] TIPI features.
    rescale_bfi_tipi_difference: true
    bfi_scale: [1, 10] # BFI questionnaire range
    tipi_scale: [1, 14] # TIPI questionnaire range

features:
    # Define input features (exogenous variables)
    input_features:
        - "Difference BFI-TIPI O"
        - "Difference BFI-TIPI C"
        - "Difference BFI-TIPI E"
        - "Difference BFI-TIPI A"
        - "Difference BFI-TIPI N"

    # Define intermediate features
    intermediate_features:
        - "MOS-X2 Q1"
        - "MOS-X2 Q2"
        - "MOS-X2 Q3"
        - "MOS-X2 Q4"
        - "SQ1"
        - "SQ2"
        - "SQ3"
        - "SQ4"
        - "SQ5"

    # Define output features (sink variables)
    output_features:
        - "Rating score"

model:
    name: "lingam_causal_model"
    algorithm: "DirectLiNGAM" # Options: DirectLiNGAM, ICALiNGAM
    random_seed: 42
    normalize_data: true

    # Bootstrap parameters
    bootstrap:
        n_sampling: 5000
        min_causal_effect: 0.09 # keep results with causal effect magnitude above this threshold
        replication_prob_threshold: 0.5
        n_jobs: -1 # Parallel workers for bootstrap (-1 = all cores, 1 = serial)
        # Drop bootstrap edges that run backward relative to the fitted
        # causal_order_ (parents must precede children). Without this, two
        # weakly-identified variables whose relative order flips across
        # resamples (e.g. a near-50/50 split) can both clear
        # replication_prob_threshold independently and survive into the
        # robust adjacency matrix as a cycle. Disable only to inspect the raw,
        # possibly-cyclic per-edge probabilities.
        enforce_acyclic: false

    # Prior knowledge configuration
    prior_knowledge:
        use_prior: true
        # Will be automatically configured based on feature groups

visualization:
    save_graphs: true
    formats: ["pdf", "png"]
    lower_limit: 1e-9

evaluation:
    save_matrices: true
    save_effects: true
    matrix_format: "npy" # Options: npy, csv

inference:
    model_path: "./causal_outputs/models/lingam_causal_model_robust_model_data.npy"
    enable_inference: true
